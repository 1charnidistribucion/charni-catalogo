<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CHARNI Distribución - Catálogo Completo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="header">
<div class="header-content">
<div class="logo-container">
<div class="logo-icon">CH</div>
<div class="logo-text">
<h1>CHARNI DISTRIBUCIÓN</h1>
<p>Calidad Premium</p>
</div>
</div>
<button class="cart-btn" onclick="openCart()">
🛒 Carrito <span class="cart-count" id="cartCount">0</span>
</button>
</div>
</header>
<section class="hero" id="hero">
<div class="hero-bg" id="heroBg"></div>
<div class="hero-overlay"></div>
</section>
<div class="hero-title">
<h2>Catálogo de Productos</h2>
<p>Embutidos y Quesos de Primera Calidad</p>
</div>
<main class="container">

<!-- PANTALLA 1: Grilla de marcas -->
<div id="screen-marcas" class="screen-marcas">
  <div class="marcas-grid">
    <button class="marca-card" onclick="irACategorias('donatilio')">
      <div class="marca-card-inner">
        <div class="marca-initial" style="background:#fdf0e0;color:#8b5e1a">DA</div>
        <div class="marca-card-name">Don Atilio</div>
        <div class="marca-card-sub">Quesos</div>
      </div>
    </button>
    <button class="marca-card" onclick="irACategorias('cagnoli')">
      <div class="marca-card-inner">
        <div class="marca-initial" style="background:#e8f0fd;color:#1a3a8b">CA</div>
        <div class="marca-card-name">Cagnoli</div>
        <div class="marca-card-sub">Fiambres</div>
      </div>
    </button>
    <button class="marca-card" onclick="irACategorias('lasdinas')">
      <div class="marca-card-inner">
        <div class="marca-initial" style="background:#fdf5f7;color:#8b1538">LD</div>
        <div class="marca-card-name">Las Dinas</div>
        <div class="marca-card-sub">Artesanal · Tandil</div>
      </div>
    </button>
    <button class="marca-card" onclick="irACategorias('vidal')">
      <div class="marca-card-inner">
        <div class="marca-initial" style="background:#edf7ed;color:#1a6b2a">VI</div>
        <div class="marca-card-name">Lácteos Vidal</div>
        <div class="marca-card-sub">Lácteos</div>
      </div>
    </button>
  </div>
</div>

<!-- PANTALLA 2: Categorías de marca -->
<div id="screen-categorias" class="screen-categorias hidden">
  <div class="screen-header">
    <button class="back-btn" onclick="volverAMarcas()">← Volver</button>
    <span class="screen-header-title" id="categorias-titulo"></span>
  </div>
  <div class="categorias-grid" id="categorias-grid"></div>
</div>

<!-- PANTALLA 3: Productos -->
<div id="screen-productos" class="hidden">
  <div class="screen-header">
    <button class="back-btn" onclick="volverACategorias()">← Volver</button>
    <span class="screen-header-title" id="productos-titulo"></span>
  </div>
  <div class="products-grid" id="screen-productos-grid"></div>
</div>

</main>
<div class="modal" id="cartModal">
<div class="modal-content">
<div class="modal-header">
<h3>🛒 Mi Pedido</h3>
<button class="close-btn" onclick="closeCart()">&times;</button>
</div>
<div id="cartItems"></div>
<div class="cart-actions" id="cartActions" style="display:none">
<button class="btn-send" onclick="sendWhatsApp()">📱 Enviar por WhatsApp</button>
<button class="btn-clear" onclick="clearCart()">🗑️ Vaciar</button>
</div>
</div>
</div>
<a href="https://wa.me/5492213188614?text=Hola!%20Quiero%20consultar%20sobre%20sus%20productos" class="whatsapp-float" target="_blank">

<script src="products.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
